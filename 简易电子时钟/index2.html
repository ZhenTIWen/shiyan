<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>电子时钟</title>
		<style>
			  body {
			            font-family: 'Arial', sans-serif;
			            display: flex;
			            justify-content: center;
			            align-items: center;
			            height: 100vh;
			           
			            margin: 0;
	
						
			        }
					.body-cnainer{
						background-image:  url(./img/动_stunv.gif);
						background-size: cover;
						background-position: center;
						background-repeat: no-repeat;
						width: 100%;
						height: 100vh;
					}
			        
			        .clock-container {
			            text-align: center;
			        }
			        
			        .time {
			            font-size: 5rem;
			            font-weight: bold;
			            color: #333;
			            margin-bottom: 10px;
			        }
			        
			        .date {
			            font-size: 1.5rem;
			            color: #635a74;
			        }
			        
			        .timezone {
			            font-size: 1rem;
			            color: #888;
			            margin-top: 5px;
			        }
			    </style>
			</head>
			<body class="body-cnainer">
			    <div class="clock-container">
			        <div class="time" id="time">00:00:00</div>
			        <div class="date" id="date">2023年1月1日</div>
			        <div class="timezone" id="timezone">东八区北京时间</div>
					<div><a href="index.html">返回</a></div>
			    </div>
		
			    <script>
			        function updateClock() {
			            const now = new Date();
			            
			            // 格式化时间
			            const hours = String(now.getHours()).padStart(2, '0');
			            const minutes = String(now.getMinutes()).padStart(2, '0');
			            const seconds = String(now.getSeconds()).padStart(2, '0');
			            
			            // 格式化日期
			            const year = now.getFullYear();
			            const month = now.getMonth() + 1;
			            const day = now.getDate();
			            const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
			            const weekday = weekdays[now.getDay()];
			            
			            // 更新DOM
			            document.getElementById('time').textContent = `${hours}:${minutes}:${seconds}`;
			            document.getElementById('date').textContent = `${year}年${month}月${day}日 ${weekday}`;
			        }
			        
			        // 初始更新
			        updateClock();
			        
			        // 每秒更新一次
			        setInterval(updateClock, 1000);
			    </script>
			</body>
	</head>
	<body>
		
	</body>
</html>
